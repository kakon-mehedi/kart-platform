openapi: 3.0.3
info:
  title: kart-analytics-service Internal Query API
  version: 1.1.0
  description: >
    Internal-only, read-only dashboards/funnels query surface over Analytics' warehouse
    read models. Not reachable through the public API Gateway. Analytics ingests the full
    platform event fan-in (ADR-0004) and publishes nothing back to the bus; this API is the
    service's only synchronous surface, serving the initial dashboard/funnel set enumerated
    in requirement-spec.md §6 (D4a).

servers:
  - url: https://internal.kart.local/analytics
    description: >
      Internal network segment only (admin console, internal service-to-service callers,
      BI-tool connector). Never routed through the public API Gateway (BRD §5.4; architecture.md).

security:
  - internalClientCredentials: [analytics.dashboards.read]

paths:
  /internal/v1/funnels/order-conversion:
    get:
      operationId: getOrderConversionFunnel
      summary: Order conversion funnel — CartCheckedOut → OrderCreated → OrderConfirmed → PaymentCompleted → OrderDelivered.
      description: >
        Per-stage counts and drop-off rate. Grounded in BRD §10's annotation of `CartCheckedOut`
        as "(funnel/conversion tracking)" — requirement-spec.md §6 D4a.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Funnel stage counts and drop-off rates for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      stages:
                        type: array
                        items:
                          type: object
                          required: [stage, count]
                          properties:
                            stage:
                              type: string
                              enum: [CartCheckedOut, OrderCreated, OrderConfirmed, PaymentCompleted, OrderDelivered]
                            count: { type: integer, format: int64 }
                            dropOffRate:
                              type: number
                              nullable: true
                              description: Fraction lost vs. the previous stage; null for the first stage.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/revenue:
    get:
      operationId: getRevenueDashboard
      summary: Revenue aggregated from OrderCreated/PaymentCompleted payload totals, by SKU/category.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
        - name: sku
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Revenue time series for the requested window/breakdown.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      series:
                        type: array
                        items:
                          type: object
                          required: [bucketStart, revenue]
                          properties:
                            bucketStart: { type: string, format: date-time }
                            revenue: { $ref: '#/components/schemas/Money' }
                            orderCount: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/fulfillment-performance:
    get:
      operationId: getFulfillmentPerformanceDashboard
      summary: Time-to-ship/time-to-deliver, from ShipmentDispatched → DeliveryStatusUpdated → OrderDelivered.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Fulfillment latency percentiles for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      timeToShip: { $ref: '#/components/schemas/DurationPercentiles' }
                      timeToDeliver: { $ref: '#/components/schemas/DurationPercentiles' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/inventory-movement:
    get:
      operationId: getInventoryMovementDashboard
      summary: Stock reservation/release/replenishment trends.
      description: >
        From `InventoryReserved`, `InventoryReservationFailed`, `InventoryReleased`,
        `InventoryReplenished` (ADR-0007 added the latter two to the catalog).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
        - name: sku
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Reservation/release/replenishment/failure counts for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      reserved: { type: integer, format: int64 }
                      reservationFailed: { type: integer, format: int64 }
                      released: { type: integer, format: int64 }
                      replenished: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/catalog-pricing:
    get:
      operationId: getCatalogPricingDashboard
      summary: ProductCreated/ProductPriceChanged/CategoryUpdated volume and change frequency.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Catalog/pricing change-event volume for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      productsCreated: { type: integer, format: int64 }
                      priceChanges: { type: integer, format: int64 }
                      categoryUpdates: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/promotions-effectiveness:
    get:
      operationId: getPromotionsEffectivenessDashboard
      summary: Coupon/promotion redemption rate and attributable order volume.
      description: From `CouponRedeemed`, `PriceQuoteIssued`, `PromotionActivated` (BRD §10).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Redemption rate and attributable order volume for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      couponsRedeemed: { type: integer, format: int64 }
                      quotesIssued: { type: integer, format: int64 }
                      attributableOrderVolume: { $ref: '#/components/schemas/Money' }
                      redemptionRate: { type: number, description: "couponsRedeemed / quotesIssued for the window" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/user-growth:
    get:
      operationId: getUserGrowthDashboard
      summary: Signups, logins, profile-change volume over time.
      description: From `UserRegistered`, `SessionCreated`, `UserAccountUpdated`/`UserProfileUpdated` (BRD §10).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Signup/login/profile-change counts for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      signups: { type: integer, format: int64 }
                      sessionsCreated: { type: integer, format: int64 }
                      profileChanges: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/reviews-ratings:
    get:
      operationId: getReviewsRatingsDashboard
      summary: ReviewSubmitted volume and rating distribution.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
      responses:
        '200':
          description: Review volume and rating distribution for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      reviewCount: { type: integer, format: int64 }
                      ratingDistribution:
                        type: object
                        description: Count of reviews per star rating (keys "1".."5").
                        additionalProperties: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/admin-audit:
    get:
      operationId: getAdminAuditDashboard
      summary: AdminActionPerformed trail, for back-office accountability.
      description: Added to the Event Catalog by ADR-0007; audit trail only, no PII beyond what AdminActionPerformed itself carries.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: actionType
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Admin action trail for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      actions:
                        type: array
                        items:
                          type: object
                          required: [occurredAt, actionType, adminId]
                          properties:
                            occurredAt: { type: string, format: date-time }
                            actionType: { type: string }
                            adminId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/v1/dashboards/notification-delivery:
    get:
      operationId: getNotificationDeliveryDashboard
      summary: NotificationSent / WishlistPriceAlertTriggered delivery-status volume by channel.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Granularity'
        - name: channel
          in: query
          required: false
          schema: { type: string, example: email }
      responses:
        '200':
          description: Delivery-status volume by channel for the requested window.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    properties:
                      byChannel:
                        type: array
                        items:
                          type: object
                          required: [channel, sent]
                          properties:
                            channel: { type: string }
                            sent: { type: integer, format: int64 }
                            priceAlertsTriggered: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --- Added this pass (11th dashboard endpoint; purely additive — none of the other nine
  # paths above, or their schemas, are touched by this addition). ---
  # Source: genai-business-assistant-spec.md §10.3 (exact query-parameter signature and
  # response shape); database-design.md "product_performance_dashboard" (added this pass) for
  # the read model this serves; edge-cases.md "Ranking Ties at the Limit Cutoff
  # (product-performance)" for the deterministic sku-ascending tiebreak surfaced in the schema
  # description below; edge-cases.md "Note: `limit` Parameter Bounds — No New Edge Case" for
  # the explicit hand-off making the actual min/max bound this stage's own job (see the
  # `limit` parameter's own comment for the reasoning behind the chosen bound).
  /internal/v1/dashboards/product-performance:
    get:
      operationId: getProductPerformanceDashboard
      summary: Top/bottom-N products ranked by revenue, units sold, or order count over a window.
      description: >
        Backs `kart-ai-assistant-service`'s product-ranking questions (genai-business-assistant-spec.md
        §10.3, e.g. "top 5 selling products") — the one capability none of the other ten
        dashboards/funnels can answer, since none of them sorts and truncates a result set.
        Ties on the requested `metric` at the `limit` cutoff are broken deterministically by
        `sku` ascending (edge-cases.md "Ranking Ties at the Limit Cutoff (product-performance)"),
        so repeat calls against an unchanged window always return the identical set and order of
        products — never left to MongoDB's unspecified order for equal sort-key values; exactly
        `limit` rows are always returned once at least `limit` candidates exist. Same eventual-
        consistency caveat as every other dashboard applies: a window spanning today's still-
        provisional bucket can see both a product's metrics *and* its rank membership shift once
        nightly reconciliation completes (edge-cases.md "Rank Order/Membership Changes on
        Reconciliation (product-performance)") — disclosed via the standard
        `isProvisional`/`reconciledThrough` envelope fields below, with no ranking-specific signal
        beyond that (same decision).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [revenue, units_sold, order_count] }
          description: >
            Which metric to rank products by. All three metrics are still returned per entry
            (genai-business-assistant-spec.md §10.3), so a caller can show secondary metrics
            even when ranked by one.
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [desc, asc], default: desc }
          description: "desc = top-N (highest metric first); asc = bottom-N (lowest metric first)."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
          description: >
            Max products returned (exactly `limit`, per the deterministic-tiebreak decision
            above, once at least `limit` candidates exist for the window). Bounds are this
            stage's own input-validation job, not a domain edge case (edge-cases.md's "Note:
            `limit` Parameter Bounds — No New Edge Case" hands this off explicitly): `minimum:
            1` rejects a meaningless empty-ranking request; `maximum: 100` is sized for this
            endpoint's actual consumers — a chat/table UI rendering a ranked list
            (genai-business-assistant-spec.md §13.2) and the business flows catalog's "top N
            products" pattern, both of which cite N in the single/low-double-digit range (e.g.
            top 5, top 10) — with generous headroom for a wider ad hoc pull, while still
            bounding worst-case response/render payload well below full product-catalog scale.
            A caller needing a full-catalog ranking should use the bucketed `revenue`/
            `inventory-movement` dashboards' `sku`/`category` filters instead of raising this
            limit further.
      responses:
        '200':
          description: >
            Up to `limit` products ranked by the requested `metric` and `direction` for the
            window, each carrying all three metrics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DashboardEnvelope'
                  - type: object
                    required: [products]
                    properties:
                      products:
                        type: array
                        maxItems: 100
                        description: >
                          Ordered by the requested `metric`/`direction`; ties at the `limit`
                          cutoff are broken by `sku` ascending, so result order is stable and
                          reproducible across repeat calls against an unchanged window
                          (edge-cases.md "Ranking Ties at the Limit Cutoff
                          (product-performance)").
                        items:
                          type: object
                          required: [sku, category, revenue, unitsSold, orderCount]
                          properties:
                            sku: { type: string }
                            category: { type: string }
                            revenue: { $ref: '#/components/schemas/Money' }
                            unitsSold: { type: integer, format: int64 }
                            orderCount: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    internalClientCredentials:
      type: oauth2
      description: >
        Identity-issued OAuth2 Client Credentials token (BRD §24.1), scoped for internal
        callers only (admin console, internal service-to-service, BI-tool connector) — same
        pattern as this platform's other internal-only endpoints (e.g.
        kart-identity-service's `/internal/users/{userId}/lock`, per ADR-0010).
      flows:
        clientCredentials:
          tokenUrl: https://internal.kart.local/identity/oauth2/token
          scopes:
            analytics.dashboards.read: Read access to Analytics' internal dashboards/funnels query surface.

  parameters:
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: Inclusive window start (event time).
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: Exclusive window end (event time).
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [hour, day, week, month], default: day }
      description: Time-series bucket size.

  responses:
    Unauthorized:
      description: Missing/invalid internal client-credentials token.
    Forbidden:
      description: Token valid but missing the `analytics.dashboards.read` scope.
    # Added this pass, alongside product-performance (the first endpoint in this contract
    # with real enum/bounds validation to fail on — `metric`/`direction` enums, `limit`
    # min/max — per api-standards.md's ProblemDetails-based Consistent Response Model).
    BadRequest:
      description: >
        Request failed validation — e.g. an unrecognized `metric`/`direction` value, or
        `limit` outside its `minimum`/`maximum` bounds. Returned as `ProblemDetails`
        (api-standards.md's Consistent Response Model), produced solely by the validation-
        failure path, never hand-built per endpoint.
    ServerError:
      description: >
        Unhandled infrastructure failure (e.g. MongoDB unavailable), returned as
        `ProblemDetails` by the service's single global exception handler
        (api-standards.md's Error Handling section) — never a bespoke per-endpoint shape.

  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, example: USD }

    DurationPercentiles:
      type: object
      properties:
        p50Hours: { type: number }
        p95Hours: { type: number }
        p99Hours: { type: number }

    DashboardEnvelope:
      type: object
      description: >
        Common metadata every dashboard/funnel response carries, surfacing the eventual-
        consistency window rather than hiding it (ddd-cqrs-standards.md "surface, don't
        hide"; architecture.md "Non-Functional Targets Proposed by This Stage").
      required: [generatedAt, isProvisional]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this response was computed.
        isProvisional:
          type: boolean
          description: >
            True until the nightly batch reconciliation (edge-cases.md "Out-of-Order Event
            Arrival" decision) finalizes the day's figures — proposed to complete by 06:00 UTC
            (architecture.md). Reflects late/out-of-order event arrival across the full
            fan-in (ADR-0004) plus the RabbitMQ→Kafka dual-publish migration window (BRD §15).
        reconciledThrough:
          type: string
          format: date
          nullable: true
          description: Last date fully reconciled by the nightly batch; null if none yet for this window.
